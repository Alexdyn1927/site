baseurl: "/" # The subpath of your site. Use "" if you're hosting a blog at the root level.
url: "http://ellekasai.github.io" # the base hostname & protocol for your site
title: "Co-Lab"

# Author configuration
author:
  name: "Anonymous"
  bio: "Default site author"
  avatar: "/images/default-avatar.jpg"

# This is used by feed.xml. Uncomment if you want to use it.
# description: "..."

gems:
  - jemoji
exclude:
  - "README.md"
  - "CHANGELOG.md"
  - "CNAME"
  - "Gemfile"
  - "Gemfile.lock"
permalink: :title
defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Anonymous"

# Excerpt settings
excerpt_separator: <!--more-->"
show_excerpts: true